name: Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  make:
    name: Build Sileo
    runs-on: macos-14
    permissions:
      contents: write
    env:
      # Branch builds produce the side-by-side Nightly package; tag builds produce the stable package.
      NIGHTLY: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
      # Xcode 15 builds SwiftPM dependencies for iOS 12.0 minimum, so the app target must match.
      XCODEBUILD_FLAGS: IPHONEOS_DEPLOYMENT_TARGET=12.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_15.4.app

      - name: Build Sileo (iphoneos-arm)
        run: make clean package DEBUG=0 ALL_BOOTSTRAPS=1 NIGHTLY=$NIGHTLY SILEO_PLATFORM=iphoneos-arm

      - name: Build Sileo (iphoneos-arm64)
        run: make clean package DEBUG=0 ALL_BOOTSTRAPS=1 NIGHTLY=$NIGHTLY SILEO_PLATFORM=iphoneos-arm64

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: sileo-debs
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
